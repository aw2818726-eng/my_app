name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lift_log_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Copy the app into it
        run: npx cap sync android

      - name: Use the Lift Log icon
        run: |
          pip install pillow
          python3 make_icons.py

      - name: Build the APK
        working-directory: lift_log_android/android
        run: ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lift_log_apk
          path: lift_log_android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
